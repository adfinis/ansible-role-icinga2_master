---
- name: Warn about deprecation in favor of the adfinis.icinga2 collection
  ansible.builtin.debug:
    msg: >-
      DEPRECATION WARNING: The standalone role adfinis.icinga2_master has been migrated to the
      adfinis.icinga2 collection and will no longer receive updates. Please switch to
      adfinis.icinga2.icinga2_master (https://github.com/adfinis/ansible-collection-icinga2).
  tags:
    - always

- name: Include os specific vars
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution }}_{{ ansible_distribution_major_version }}.yml"
    - "{{ ansible_os_family }}.yml"
  tags:
    - role::icinga2_master
    - role::icinga2_master:install
    - role::icinga2_master:config

- name: Import installation tasks
  ansible.builtin.import_tasks: installation.yml
  tags:
    - role::icinga2_master
    - role::icinga2_master:install

- name: Iport configuration tasks
  ansible.builtin.import_tasks: configuration.yml
  tags:
    - role::icinga2_master
    - role::icinga2_master:config
